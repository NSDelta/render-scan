name: Build RenderTrace dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'render_trace.m'
      - '.github/workflows/build-render-trace.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile RenderTrace.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -dynamiclib -O2 -Wno-unused-function \
            -framework UIKit -framework Foundation \
            -o RenderTrace.dylib render_trace.m
          file RenderTrace.dylib
          lipo -info RenderTrace.dylib

      - name: Codesign
        run: |
          if command -v ldid >/dev/null 2>&1; then
            ldid -S RenderTrace.dylib
          else
            codesign -f -s - RenderTrace.dylib
          fi
          ls -la RenderTrace.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderTrace.dylib
          path: RenderTrace.dylib
